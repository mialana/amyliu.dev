name = "amyliu-dev"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-03-05"

compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public", "no_handle_cross_request_promise_resolution"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = [ "/projects/" ]

[[routes]]
pattern = "amyliu.dev"
custom_domain = true