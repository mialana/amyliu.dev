name = "amyliu-dev"
main = "dist/_worker.js/index.js"
compatibility_date = "2025-03-25"

workers_dev = false
preview_urls = true

compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

[[routes]]
pattern = "amyliu.dev"
custom_domain = true