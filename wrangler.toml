name = "amyliu-dev"
main = "dist/_worker.js/index.js"
compatibility_date = "2026-03-05"

compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = [ "/projects/", "/_image*" ]

[[routes]]
pattern = "amyliu.dev"
custom_domain = true