name: Deploy Worker
on:
    push:
        branches:
            - main
jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: cloudflare
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Run CI (Install build dependencies)
              run: npm run ci

            - name: Run Build
              run: npm run build

            - name: Run Deploy
              run: npm run deploy -- --config wrangler.static.toml
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
